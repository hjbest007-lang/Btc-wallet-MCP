[project]
name = "btc-wallet-mcp"
version = "0.2.0"
description = "Human-approved multi-coin hot wallet (BTC, ETH, AVAX, XRP, LTC) as an MCP stdio server"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "bdkpython==2.2.0",
    "mcp>=1.2,<2",
    "cryptography>=42",
    "eth-account>=0.13,<1",
    "xrpl-py>=4,<6",
    "embit>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
btc-wallet-mcp = "btc_wallet_mcp.cli:main"
wallet-mcp = "wallet_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: hits a public signet Esplora (opt-in: BTC_WALLET_INTEGRATION=1)"]
