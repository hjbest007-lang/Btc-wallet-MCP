[project]
name = "btc-wallet-mcp"
version = "0.2.0"
description = "Human-approved multi-coin hot wallet (BTC, ETH, AVAX, XRP, LTC, USDC, USDT, SOL) as an MCP stdio server"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "bdkpython==2.2.0",
    "mcp>=1.30,<2",
    "cryptography>=42",
    "eth-account>=0.13,<1",
    "xrpl-py>=4,<6",
    "embit>=0.7,<1",
    "solders>=0.21,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pyinstaller>=6"]

[project.scripts]
btc-wallet-mcp = "btc_wallet_mcp.cli:main"
wallet-mcp = "wallet_mcp.cli:main"
# Console script so a double-click keeps a visible window. A gui-script would
# start pythonw and hide that window.
wallet-beheer = "wallet_mcp.launch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: public signet/testnet reads only (opt-in: BTC_WALLET_INTEGRATION=1 or WALLET_MCP_INTEGRATION=1). Never broadcasts.",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["S"]

[tool.ruff.lint.per-file-ignores]
# The chain client validates the URL and refuses redirects before opening it.
"src/btc_wallet_mcp/guard.py" = ["S310"]
# Pytest uses assert. The install dry-run test executes the repo's own script.
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["src/btc_wallet_mcp/guard.py"]
strict = true
warn_unused_ignores = true
