name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install ruff bandit 'semgrep==1.181.0' mypy
      - name: Ruff security rules
        run: ruff check src tests
      - name: Bandit
        run: bandit -r src -ll -q
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off src
      - name: Mypy strict on the shared guard
        run: mypy

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
